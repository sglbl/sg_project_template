[project]
name = "sg-project-template"
authors = [
    { name = "Süleyman Gölbol"}
]
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru==0.7.3",
    "matplotlib<=3.10.0",
    "python-dotenv>=1.0.1",
    "pandas[excel]==2.2.3",
    "sentence-transformers==3.4.1",
    "transformers==4.49.0",
    "overrides>=7.7.0",
    "pypdf>=5.3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.9.1",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30.0",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "sympy>=1.13.1",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "polars>=0.20",
    "pyarrow>=16",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "duckdb>=1.5.5",
    "requests>=2.34.2",
    "tqdm>=4.69.0",
    "duckdb-cli>=1.5.5",
    "plotly>=6.9.0",
    "kaleido>=1.3.0",
    "marimo>=0.23.15"
]


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "pdoc3>=0.11.5",
    "matplotlib>=3.9.2",
    "pyproject-toml>=0.0.12",
    "pytest>=8.3.3",
    "pyright>=1.1.403",
    "mypy>=1.10",
]


[project.optional-dependencies]
cpu = [
  "torch==2.5.1",
]
gpu = [
  "torch==2.5.1",
]

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = "." # Add the project root path to the pythonpath [to be able to import the 'src' module]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::PendingDeprecationWarning"]

[tool.autopep8]
max_line_length = 150

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pyright]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportIncompatibleVariableOverride = false
reportReturnType = false
reportGeneralTypeIssues = false
reportAssignmentType = false
reportCallIssue = false
reportUnusedCallResult = false
