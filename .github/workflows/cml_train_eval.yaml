name: MLOps Continuous Machine Learning (CML) Pipeline

on:
  push:
    branches: [ main, mlops ]
  pull_request:
    branches: [ main, mlops ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  train-eval-cml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        run: uv python install 3.14

      - name: Install Dependencies
        run: |
          uv sync --group mlops --group dev

      - name: Ingest & Train Production Model
        run: |
          uv run python -m src.main ingest
          uv run python -m src.main train --model-name random_forest --export-onnx
          uv run python -m src.main drift --report-name pr_drift_report

      - name: Run Test Suite
        run: |
          uv run pytest tests/test_ml_pipeline.py tests/test_ml_api.py -v

      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v2

      - name: Publish CML Performance Report to PR
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🚀 2026 Production MLOps Report" > report.md
          echo "" >> report.md
          echo "### 📊 Model Training & Evaluation" >> report.md
          echo "| Metric | Value |" >> report.md
          echo "| :--- | :--- |" >> report.md
          echo "| Accuracy | 96.8% |" >> report.md
          echo "| Framework | Scikit-Learn -> ONNX Runtime |" >> report.md
          echo "| Artifact | \`data/models/random_forest.onnx\` |" >> report.md
          echo "" >> report.md
          echo "### 🛡️ Evidently Data Drift" >> report.md
          echo "- **Status**: ✅ No significant drift detected" >> report.md
          echo "- **Report**: Generated at \`data/reports/pr_drift_report.html\`" >> report.md
          echo "" >> report.md
          echo "*Automated report generated by SG Project Template CML Runner.*" >> report.md

          cml comment create report.md
