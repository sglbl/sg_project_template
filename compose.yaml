name: sgproject

services:
  ui:
    build: 
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RUSTFS_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-rustfsadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      - DB_HOST=postgres
      - DB_PORT=5432
      - API_URL=http://api:8001
    ports:
      - "${UI_PORT:-8600}:8501"

  api:
    build: 
      context: .
      dockerfile: docker/app.Dockerfile
    command: python -m src.main api --host 0.0.0.0 --port 8001
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RUSTFS_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-rustfsadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      - DB_HOST=postgres
      - DB_PORT=5432
    ports:
      - "${API_PORT:-8100}:8001"

  marimo:
    build:
      context: .
      dockerfile: docker/marimo.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RUSTFS_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-rustfsadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      - DB_HOST=postgres
      - DB_PORT=5432
      - API_URL=http://api:8001
    ports:
      - "${MARIMO_PORT:-2800}:2718"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: mlflow_server
    env_file:
      - .env
    ports:
      - "${MLFLOW_PORT:-5100}:5000"
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts --host 0.0.0.0
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  # High-Performance Rust S3 Object Storage Service (RustFS)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_storage_server
    env_file:
      - .env
    environment:
      - RUSTFS_ACCESS_KEY=${AWS_ACCESS_KEY_ID:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs-data:/data
    command: /data
    restart: unless-stopped
    ports:
      - "${RUSTFS_PORT:-9100}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9101}:9001"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5500}:5432"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mlflow-data:
  rustfs-data:
  prometheus-data:
  grafana-data: